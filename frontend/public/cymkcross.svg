<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- CMYK quadrants -->
  <!-- Cyan -->
  <path d="M50,50 L50,20 A30,30 0 0,0 20,50 Z" fill="#00FFFF"/>
  <!-- Magenta -->
  <path d="M50,50 L80,50 A30,30 0 0,0 50,20 Z" fill="#FF00FF"/>
  <!-- Yellow -->
  <path d="M50,50 L20,50 A30,30 0 0,0 50,80 Z" fill="#FFFF00"/>
  <!-- Black -->
  <path d="M50,50 L50,80 A30,30 0 0,0 80,50 Z" fill="#000000"/>
  <!-- Registration ring -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#000000" stroke-width="4"/>
  <!-- Central dot -->
  <circle cx="50" cy="50" r="8" fill="#000000" stroke="#000000" stroke-width="1"/>
  <!-- Alignment cross (hairline) -->
  <line x1="5" y1="50" x2="95" y2="50" stroke="#000000" stroke-width="4"/>
  <line x1="50" y1="5" x2="50" y2="95" stroke="#000000" stroke-width="4"/>
</svg>
