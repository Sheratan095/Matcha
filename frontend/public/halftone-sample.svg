<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <!-- Source image for the halftone photo filter (the fx-halftone tokens, shown in the styleguide).
       Halftoning needs a tonal range and a mid-dark average, so this is shaded, not flat: four spheres in the
       kit's drums, lit from the top left, on a wall and table that fall into shadow. Smooth ramps make the
       dots swell and shrink. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8d8a6"/>
      <stop offset=".55" stop-color="#8f7b4a"/>
      <stop offset="1" stop-color="#3f3219"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d7747"/>
      <stop offset="1" stop-color="#241b0d"/>
    </linearGradient>
    <radialGradient id="matcha" cx=".35" cy=".3" r=".78" fx=".3" fy=".25">
      <stop offset="0" stop-color="#eaf8c4"/>
      <stop offset=".35" stop-color="#5fae30"/>
      <stop offset=".75" stop-color="#1f5a1e"/>
      <stop offset="1" stop-color="#0b210d"/>
    </radialGradient>
    <radialGradient id="strawberry" cx=".35" cy=".3" r=".78" fx=".3" fy=".25">
      <stop offset="0" stop-color="#ffe3df"/>
      <stop offset=".35" stop-color="#e63a52"/>
      <stop offset=".75" stop-color="#8e1127"/>
      <stop offset="1" stop-color="#3d0510"/>
    </radialGradient>
    <radialGradient id="yolk" cx=".35" cy=".3" r=".78" fx=".3" fy=".25">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset=".35" stop-color="#f0b21f"/>
      <stop offset=".75" stop-color="#8a5a00"/>
      <stop offset="1" stop-color="#3a2400"/>
    </radialGradient>
    <radialGradient id="cobalt" cx=".35" cy=".3" r=".78" fx=".3" fy=".25">
      <stop offset="0" stop-color="#d9e0ff"/>
      <stop offset=".35" stop-color="#2b48f0"/>
      <stop offset=".75" stop-color="#14257f"/>
      <stop offset="1" stop-color="#070d3d"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="300" height="250" fill="url(#wall)"/>
  <rect y="250" width="300" height="150" fill="url(#table)"/>

  <circle cx="225" cy="105" r="46" fill="url(#cobalt)"/>

  <g fill="#0d0905" opacity=".75" filter="url(#soft)">
    <ellipse cx="140" cy="318" rx="92" ry="15"/>
    <ellipse cx="240" cy="336" rx="58" ry="11"/>
    <ellipse cx="86" cy="390" rx="42" ry="8"/>
  </g>

  <circle cx="110" cy="235" r="82" fill="url(#matcha)"/>
  <circle cx="222" cy="285" r="50" fill="url(#strawberry)"/>
  <circle cx="70" cy="352" r="36" fill="url(#yolk)"/>
</svg>
