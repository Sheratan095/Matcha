<!DOCTYPE html>
<!--
	Matcha "Press Edition", translated for email clients. Mirrors frontend/src/ui/styles/tokens.css:
	paper stock, 3px ink outlines, hard unblurred shadows, heavy uppercase Archivo, Space Mono labels.

	Email-specific constraints this file is written around:
	  - Table layout and INLINE styles throughout: Gmail and Outlook ignore much of <style>.
	  - The hard shadow is a thicker right/bottom border, NOT box-shadow, which Gmail strips.
	  - No CSS variables, no inline SVG (the logo tile is rebuilt in HTML), no transforms.
	  - Archivo / Space Mono load from Google Fonts where the client allows it (Apple Mail, iOS);
	    elsewhere the stacks fall back to Arial Black / Courier New, which keep the same character.
-->
<html lang="{{LANGUAGE}}" dir="auto">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<!-- The app is light-only; stop clients from auto-inverting the paper and ink. -->
	<meta name="color-scheme" content="light only" />
	<meta name="supported-color-schemes" content="light" />
	<title>{{TITLE}}</title>
	<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
	<style>
		/* The <li> items are generated by the mailer without inline styles. */
		ul.tips li { margin: 0 0 8px; padding-left: 4px; color: #3b362d; font-size: 14px; line-height: 1.5; }
		ul.tips li:last-child { margin-bottom: 0; }

		@media (max-width: 600px) {
			.px    { padding-left: 20px !important; padding-right: 20px !important; }
			.title { font-size: 26px !important; }
		}
	</style>
</head>
<body style="margin:0;padding:0;background-color:#f1e7cf;">
	<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f1e7cf;">
		<tr>
			<td align="center" style="padding:40px 16px;">
				<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">

					<!-- WORDMARK: the tea-tin tile + MATCHA lettering with its misregistered green plate -->
					<tr>
						<td style="padding:0 0 24px 0;">
							<table role="presentation" cellpadding="0" cellspacing="0" border="0">
								<tr>
									<td width="34" height="34" align="center" valign="middle" style="width:34px;height:34px;background-color:#72c13c;border:3px solid #15130f;border-right-width:5px;border-bottom-width:5px;border-radius:9px;font-family:Arial,sans-serif;font-size:18px;line-height:34px;color:#15130f;">&#9829;</td>
									<td style="padding-left:12px;">
										<div style="font-family:'Archivo','Arial Black',Arial,sans-serif;font-weight:900;font-stretch:125%;font-size:28px;line-height:0.8;letter-spacing:-0.045em;text-transform:uppercase;color:#15130f;text-shadow:2px 2px 0 #72c13c;">Matcha</div>
										<div style="padding-top:7px;font-family:'Space Mono','Courier New',monospace;font-weight:700;font-size:9px;line-height:1;letter-spacing:0.18em;text-transform:uppercase;color:#15130f;">Press edition</div>
									</td>
								</tr>
							</table>
						</td>
					</tr>

					<!-- CARD: card stock, ink outline, hard shadow -->
					<tr>
						<td style="background-color:#fbf6e6;border:3px solid #15130f;border-right-width:9px;border-bottom-width:9px;border-radius:20px;">
							<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

								<!-- Header band: matcha, the brand drum (text on it is always ink) -->
								<tr>
									<td class="px" style="background-color:#72c13c;border-bottom:3px solid #15130f;border-radius:17px 17px 0 0;padding:28px 32px 26px;">
										<h1 class="title" style="margin:0;font-family:'Archivo','Arial Black',Arial,sans-serif;font-weight:900;font-stretch:78%;font-size:40px;line-height:0.9;letter-spacing:-0.01em;text-transform:uppercase;color:#15130f;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word;">{{TITLE}}</h1>
									</td>
								</tr>

								<tr>
									<td class="px" style="padding:32px;font-family:'Archivo',Arial,sans-serif;font-size:16px;line-height:1.5;color:#3b362d;">
										<p style="margin:0 0 12px;font-weight:700;color:#15130f;">{{GREETING}},</p>
										<p style="margin:0 0 28px;">{{MESSAGE}}</p>

										<!-- Button: the press mechanic, frozen at rest -->
										<table role="presentation" cellpadding="0" cellspacing="0" border="0">
											<tr>
												<td style="background-color:#72c13c;border:3px solid #15130f;border-right-width:6px;border-bottom-width:6px;border-radius:14px;">
													<a href="{{VERIFICATION_LINK}}" style="display:inline-block;padding:16px 26px;font-family:'Archivo','Arial Black',Arial,sans-serif;font-weight:900;font-stretch:112%;font-size:15px;line-height:1;letter-spacing:0.035em;text-transform:uppercase;color:#15130f;text-decoration:none;">{{BUTTON_TEXT}}</a>
												</td>
											</tr>
										</table>
										<p style="margin:14px 0 0;font-family:'Space Mono','Courier New',monospace;font-size:12px;line-height:1.5;color:#625b4b;">{{EXPIRY_TEXT}}</p>


										<!-- Tips -->
										<div style="margin-top:32px;font-family:'Archivo','Arial Black',Arial,sans-serif;font-weight:900;font-size:15px;line-height:1.1;letter-spacing:0.04em;text-transform:uppercase;color:#15130f;">{{SECURITY_TITLE}}</div>
										<ul class="tips" style="margin:12px 0 0;padding:0 0 0 20px;list-style-type:square;">
											{{SECURITY_POINTS}}
										</ul>
									</td>
								</tr>
							</table>
						</td>
					</tr>

					<!-- FOOTER: printed on the sheet, outside the card -->
					<tr>
						<td align="center" style="padding:28px 16px 0;font-family:'Space Mono','Courier New',monospace;font-size:12px;line-height:1.6;color:#625b4b;">
							<div style="color:#3b362d;">{{FOOTER_MESSAGE}}</div>
							<div style="font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:#15130f;">{{FOOTER_TEXT}}</div>
							<div style="padding-top:16px;font-size:11px;">&copy; Matcha &middot; {{ALL_RIGHTS_RESERVED}}</div>
						</td>
					</tr>

				</table>
			</td>
		</tr>
	</table>
</body>
</html>
