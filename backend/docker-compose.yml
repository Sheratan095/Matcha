version: '3.8'

services:

  # Infrastructure
  postgres:
    image: postgres:16
    restart: always
    environment: # Use environment variables from the .env file
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount the custom init shell script that processes subdirectories
      - ./infra/db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      # Mount migrations and seeds to a separate location where the script can read them
      - ./infra/db/migrations:/init-scripts/migrations:ro
      - ./infra/db/seeds:/init-scripts/seeds:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5


  # Applications
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    environment:
      PORT: ${GATEWAY_PORT}
      HOST: ${GATEWAY_HOST}
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -f ${GATEWAY_HOST}:${GATEWAY_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification:
    build:
      context: .
      dockerfile: apps/notification/Dockerfile
    ports:
      - "${NOTIFICATION_PORT:-3002}:3002"
    environment:
      NOTIFICATION_PORT: 3002
    depends_on:
      - postgres

volumes:
  # Persistent volume for PostgreSQL data
  postgres_data:
