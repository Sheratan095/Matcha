version: '3.8'

services:

  # Infrastructure
  postgres:
    image: postgres:16
    restart: always
    environment: # Use environment variables from the .env file
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5


  # Applications
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    environment:
      PORT: ${GATEWAY_PORT}
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -f ${GATEWAY_HOST}:${GATEWAY_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Persistent volume for PostgreSQL data
  postgres_data:
