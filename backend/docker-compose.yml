services:

  # Infrastructure
  postgres:
    image: postgres:16
    restart: always
    environment: # Use environment variables from the .env file
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ} # Set the timezone for the PostgreSQL container
    ports:
      # Loopback only: just the services on this host need it. A bare "5432:5432" listens on every
      # interface, and Docker's own iptables rules bypass host firewalls like ufw.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount the custom init shell script that processes subdirectories
      - ./infra/db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      # Mount migrations and seeds to a separate location where the script can read them
      - ./infra/db/migrations:/init-scripts/migrations:ro
      - ./infra/db/seeds:/init-scripts/seeds:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for profile pictures (see docs/object-storage.md)
  # First start only: run ./infra/garage/init.sh to create the layout, bucket and key.
  garage:
    image: dxflrs/garage:v2.1.0
    restart: always
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      TZ: ${TZ}
    ports:
      - "127.0.0.1:3900:3900" # S3 API (uploads / deletes, needs credentials): loopback only, used by profile
      # Public, read-only web endpoint for the images. Loopback only too: the browser loads them from
      # /pictures on the frontend's origin, and the frontend's server forwards that here.
      - "127.0.0.1:3902:3902"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

volumes:
  # Persistent volume for PostgreSQL data
  postgres_data:
  # Persistent volumes for Garage (object metadata + uploaded pictures)
  garage_meta:
  garage_data:
