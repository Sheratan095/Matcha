version: '3.8'

services:

  # Infrastructure
  postgres:
    image: postgres:16
    restart: always
    environment: # Use environment variables from the .env file
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ} # Set the timezone for the PostgreSQL container
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount the custom init shell script that processes subdirectories
      - ./infra/db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      # Mount migrations and seeds to a separate location where the script can read them
      - ./infra/db/migrations:/init-scripts/migrations:ro
      - ./infra/db/seeds:/init-scripts/seeds:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for profile pictures (see docs/object-storage.md)
  # First start only: run ./infra/garage/init.sh to create the layout, bucket and key.
  garage:
    image: dxflrs/garage:v2.1.0
    restart: always
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      TZ: ${TZ}
    ports:
      - "3900:3900" # S3 API (uploads / deletes, needs credentials)
      - "3902:3902" # Public web endpoint (the browser loads images from here)
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data


  # Applications
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    environment:
      PORT: ${GATEWAY_PORT}
      HOST: ${GATEWAY_HOST}
      TZ: ${TZ}
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -f ${GATEWAY_HOST}:${GATEWAY_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification:
    build:
      context: .
      dockerfile: apps/notification/Dockerfile
    ports:
      - "${NOTIFICATION_PORT:-3002}:3002"
    environment:
      NOTIFICATION_PORT: 3002
      TZ: ${TZ}
    depends_on:
      - postgres

  profile:
    build:
      context: .
      dockerfile: apps/profile/Dockerfile
    ports:
      - "${PROFILE_PORT:-3003}:3003"
    environment:
      PROFILE_PORT: 3003
      TZ: ${TZ}
      S3_ENDPOINT: http://garage:3900 # Reach Garage through the compose network, not localhost
    depends_on:
      - postgres
      - garage

volumes:
  # Persistent volume for PostgreSQL data
  postgres_data:
  # Persistent volumes for Garage (object metadata + uploaded pictures)
  garage_meta:
  garage_data:
